name: NEMO Lab Automation Surfaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-cache-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  call-reusable-workflow:
    uses: ./.github/workflows/reusable.yml
    with:
      message: reusable-workflow-observation
