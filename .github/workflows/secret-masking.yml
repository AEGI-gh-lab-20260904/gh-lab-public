name: NEMO Lab Secret Masking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-masking:
    runs-on: ubuntu-latest
    env:
      NEMO_TEST_SECRET: ${{ secrets.NEMO_MASK_TEST }}
    steps:
      - name: Emit secret through common log shapes
        shell: bash
        run: |
          echo "direct=$NEMO_TEST_SECRET"
          echo "embedded=before-${NEMO_TEST_SECRET}-after"
          printf 'multiline-label=%s\n' "$NEMO_TEST_SECRET"
      - name: Confirm secret was supplied without revealing it
        shell: bash
        run: |
          if [ -z "$NEMO_TEST_SECRET" ]; then
            echo "secret was not supplied"
            exit 1
          fi
          echo "secret_present=true" >> "$GITHUB_STEP_SUMMARY"
