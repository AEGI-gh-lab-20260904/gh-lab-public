name: NEMO Lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Emit deterministic metadata
        shell: bash
        run: |
          printf 'repository=%s\nrun_id=%s\nactor=%s\nsha=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_ACTOR" "$GITHUB_SHA"
      - name: Upload fixture artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nemo-lab-${{ github.run_id }}
          path: src/hello.txt
          retention-days: 1
